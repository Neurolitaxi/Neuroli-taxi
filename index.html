<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuroli Taxi Service – Basel-Land</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF3E8;--ink:#2A0F4D;--card:#fff;--line:#2A0F4D;--hot:#FF5A3C;--sun:#FFB400;--wa:#25D366;--plum:#1B0B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150830;--ink:#FFF3E8;--card:#26104F;--line:#FF8A5C}}
:root[data-theme="dark"]{--bg:#150830;--ink:#FFF3E8;--card:#26104F;--line:#FF8A5C}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:96px}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 12px}
.langs button{font:inherit;font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--hot);color:#fff;border-color:var(--hot)}
.hero{position:relative;overflow:hidden;margin:0 auto;max-width:760px;border-radius:0 0 36px 36px;background:linear-gradient(180deg,#2B0B5E 0%,#8E2A7A 45%,#FF6B3D 80%,#FFB400 100%);color:#fff;text-align:center;padding:44px 20px 0}
.sun{position:absolute;left:50%;bottom:34px;width:230px;height:230px;margin-inline-start:-115px;border-radius:50%;background:radial-gradient(circle,#FFE27A,#FFB400 60%,rgba(255,180,0,0) 72%);opacity:.9}
.hero h1{position:relative;margin:0;font-size:clamp(40px,12vw,76px);line-height:.98;font-weight:900;text-wrap:balance;text-shadow:0 4px 0 rgba(27,11,59,.5)}
.hero p.loc{position:relative;margin:10px 0 0;font-size:20px;font-weight:700;letter-spacing:.08em}
.road{position:relative;height:150px;margin-top:20px}
.sky{position:absolute;inset-inline:0;bottom:22px;width:100%;height:80px}
.taxi{position:absolute;bottom:0;left:50%;width:210px;margin-left:-105px;animation:drive 2.4s cubic-bezier(.2,.8,.2,1) both}
.asphalt{position:absolute;inset-inline:0;bottom:0;height:24px;background:var(--plum)}
@keyframes drive{from{transform:translateX(-130vw)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.taxi{animation:none}}
.wrap{max-width:720px;margin:0 auto;padding:26px 20px}
.lead{font-size:20px;font-weight:500;margin:0 0 24px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;font-weight:900;font-size:clamp(21px,6.5vw,30px);padding:18px 20px;border-radius:18px;margin-bottom:16px;box-shadow:0 8px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.wa{background:var(--wa);color:#04280F}
.call{background:var(--hot);color:#fff}
.btn svg{width:1.3em;height:1.3em;fill:currentColor;flex:none}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h2{font-size:28px;margin:40px 0 14px;font-weight:900;text-align:center}
.list{display:grid;gap:12px}
.item{background:var(--card);border-inline-start:8px solid var(--hot);border-radius:14px;padding:14px 18px;box-shadow:0 2px 12px rgba(42,15,77,.15)}
.item:nth-child(2){border-color:var(--sun)}.item:nth-child(3){border-color:#8E2A7A}
.item b{display:block;font-size:20px}
.price{margin-top:36px;padding:24px;border-radius:20px;background:linear-gradient(120deg,var(--hot),var(--sun));color:var(--plum);font-size:26px;font-weight:900;text-align:center;line-height:1.2}
footer{text-align:center;font-size:14px;padding:8px 20px 28px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:var(--wa);color:#04280F;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.fab svg{width:34px;height:34px;fill:currentColor}
</style>
</head>
